# =============================================================================
# Datenbank-Migrationen auf die gehostete Supabase-Datenbank
# =============================================================================
# Trigger : - Push auf main, der supabase/migrations/** aendert (also nach dem Merge einer PR)
#           - von Hand: Actions -> "Datenbank-Migration" -> Run workflow.
#             Von Hand ist "nur_pruefen" standardmaessig AN: es zeigt nur, was angewendet WUERDE.
#
# Ablauf  : 1. Migrationsdateien pruefen (Namen, Reihenfolge; falls scripts/pruefe-migrationen.mjs da ist)
#           2. Projekt verbinden, Stand lokal gegen gehostet vergleichen
#           3. Trockenlauf (supabase db push --dry-run)
#           4. Anwenden (supabase db push), ausser bei "nur_pruefen"
#           5. Nachpruefung: danach darf nichts mehr offen sein (upToDate)
#           6. PostgREST-Schema neu laden (sonst kennt die API neue Spalten/Funktionen nicht)
#
# Preview : Nur public (Production). Das Schema public_preview der Preview-Umgebungen migriert
#           datenbank-migration-preview.yml schon bei jedem Push in einen Pull Request.
#
# Schutz  : - Umgebung "Production": in Settings -> Environments -> Production Pflicht-Reviewer eintragen,
#             dann wartet jeder Lauf VOR dem Anwenden auf eine Freigabe.
#           - Nur ein Lauf gleichzeitig; ein laufender wird nie abgebrochen (halbe Migration waere schlimmer).
#           - Es werden nur Migrationen angewendet, die neuer sind als die letzte gehostete. Eine aeltere oder
#             geaenderte Datei wird stillschweigend uebersprungen: das faengt die PR-Pipeline ab.
#           - Kein Datenbankpasswort im Repository: die CLI holt sich mit dem Zugriffstoken eine kurzlebige
#             Anmeldung fuer den Lauf.
#
# Einmalig einzurichten (Settings -> Secrets and variables -> Actions -> Environment secrets, Umgebung
# "Production"; oder als Repository-Secret):
#   SUPABASE_ACCESS_TOKEN   Persoenliches Zugriffstoken (supabase.com/dashboard/account/tokens) einer Person,
#                           die auf das Projekt zugreifen darf. Am besten ein eigenes Token nur dafuer.
# Das Projekt steht unten in SUPABASE_PROJECT_REF (keine Zugangsdaten, nur die Kennung).
# =============================================================================

name: Datenbank-Migration

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      nur_pruefen:
        description: "Nur anzeigen, was angewendet wuerde (nichts aendern)"
        required: true
        default: true
        type: boolean

concurrency:
  group: datenbank-migration-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: hlcpxgnnyqmpqzpvgnxu
  # true, wenn wirklich angewendet werden soll (Push auf main oder von Hand mit nur_pruefen=false)
  ANWENDEN: ${{ github.event_name == 'push' || inputs.nur_pruefen == false }}

jobs:
  migrieren:
    name: Migrationen ${{ (github.event_name == 'push' || inputs.nur_pruefen == false) && 'anwenden' || 'pruefen' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Zugangsdaten vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt (siehe Kopf von datenbank-migration.yml)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migrationsdateien pruefen
        run: |
          if [ -f scripts/pruefe-migrationen.mjs ]; then
            node scripts/pruefe-migrationen.mjs
          else
            echo "scripts/pruefe-migrationen.mjs nicht vorhanden, uebersprungen."
          fi

      # pgvector laden (nur in der Kopie der Migrationsdateien auf dem Runner, das Repository bleibt unveraendert):
      # "supabase db push" oeffnet eine frische Datenbank-Sitzung, in der pgvector noch nicht geladen ist. Eine Funktion mit
      # "set hnsw.iterative_scan" scheitert dort mit "permission denied to set parameter" (Fund vom 13.10.2026, Migration
      # 20261124000000). Ist pgvector in der Sitzung geladen, geht es. Darum steht vor jeder Datei, die hnsw.* setzt, eine Zeile,
      # die den Typ vector benutzt. Die Zeile steht in derselben Sitzung wie die Anweisung danach. Eine schon angewendete Datei
      # prueft "db push" nicht erneut (es zaehlt nur die Version), und die Vorschau-Migration laeuft ueber ein eigenes Skript.
      - name: pgvector fuer Migrationen mit hnsw-Einstellung laden (nur Runner-Kopie)
        run: |
          dateien=$(grep -l "set hnsw\." supabase/migrations/*.sql || true)
          for f in $dateien; do
            sed -i "1i select '[1]'::extensions.vector; -- CI: laedt pgvector in der Sitzung (set hnsw.* braucht das)" "$f"
            echo "vorangestellt: $f"
          done
          [ -n "$dateien" ] || echo "keine Datei mit hnsw-Einstellung"

      # Alle Aufrufe der CLI, die sich mit der Datenbank verbinden, laufen ueber scripts/supabase-wiederholen.mjs: der Push auf main startet diesen Workflow
      # und "Datenbank-Migration Preview" im selben Augenblick, beide legen die Anmelderolle cli_login_postgres neu an und setzen sich gegenseitig das
      # Kennwort zurueck ("password authentication failed"). Das Skript wiederholt NUR diesen Fehler (er tritt vor der ersten Anweisung auf, nichts wird
      # doppelt angewendet), jeder andere Fehler gilt sofort. Am 16.10.2026 scheiterte so die Nachpruefung nach #157, obwohl alle Migrationen schon
      # angewendet waren, und das Neuladen des Schemas wurde uebersprungen.
      - name: Mit dem Projekt verbinden
        run: node scripts/supabase-wiederholen.mjs link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Stand vergleichen (lokal und gehostet)
        run: node scripts/supabase-wiederholen.mjs migration list --linked

      # pipefail: scheitert die CLI (auch nach den Wiederholungen), scheitert der Schritt. Ohne pipefail stand der Exitcode von "tee" fuer den ganzen
      # Aufruf, ein Fehler der CLI blieb unbemerkt und der Lauf versuchte trotzdem zu pushen.
      - name: Trockenlauf
        id: trocken
        run: |
          set -o pipefail
          node scripts/supabase-wiederholen.mjs db push --linked --dry-run | tee trocken.txt
          if grep -q "up to date" trocken.txt; then echo "offen=nein" >> "$GITHUB_OUTPUT"; else echo "offen=ja" >> "$GITHUB_OUTPUT"; fi

      - name: Migrationen anwenden
        if: env.ANWENDEN == 'true' && steps.trocken.outputs.offen == 'ja'
        run: node scripts/supabase-wiederholen.mjs db push --linked

      - name: Nachpruefung, nichts mehr offen
        if: env.ANWENDEN == 'true' && steps.trocken.outputs.offen == 'ja'
        run: |
          set -o pipefail
          node scripts/supabase-wiederholen.mjs db push --linked --dry-run | tee danach.txt
          grep -q "up to date" danach.txt || { echo "::error::Nach dem Anwenden ist noch etwas offen."; exit 1; }

      - name: PostgREST-Schema neu laden
        if: env.ANWENDEN == 'true' && steps.trocken.outputs.offen == 'ja'
        run: node scripts/supabase-wiederholen.mjs db query --linked "notify pgrst, 'reload schema'"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Datenbank-Migration (${SUPABASE_PROJECT_REF})"
            if [ "$ANWENDEN" = "true" ]; then echo "Modus: anwenden"; else echo "Modus: nur pruefen"; fi
            echo '```'
            cat trocken.txt 2>/dev/null | tail -8 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
