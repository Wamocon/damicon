# =============================================================================
# Datenbank-Drift-Check (nur lesend)
# =============================================================================
# Trigger : - taeglich um 04:17 UTC (auf dem Standard-Branch main)
#           - von Hand: Actions -> "Datenbank-Drift" -> Run workflow
#
# Zweck   : Die beiden Migrations-Workflows springen nur an, wenn eine Datei unter supabase/migrations/
#           ins Repository kommt. Dieser Lauf findet, was an ihnen vorbei in die gehostete Datenbank
#           gelangt ist, und was auf main steht, aber in einem der Schemas fehlt:
#           1. scripts/pruefe-drift.mjs: Verlauf von public und public_preview gegen die Dateien auf main
#              (Migration ohne Datei, Datei nicht angewendet, Datei nach dem Anwenden geaendert)
#           2. scripts/preview-abgleich.mjs: Struktur von public gegen public_preview, sobald beide
#              denselben Migrationsstand haben (faengt auch SQL, das ohne jeden Verlaufseintrag lief)
#
# Grenzen : - Steht public_preview wegen offener Pull Requests vor public, ueberspringt der
#             Strukturabgleich und meldet das als Warnung. Eine Handaenderung an der Struktur faellt dann
#             erst auf, wenn beide Schemas wieder gleich stehen.
#           - Der Lauf aendert nichts: nur SELECT und pg_dump. Er repariert auch nichts. Wer eine Abweichung
#             findet, schreibt die fehlende Migration als Datei in einen Pull Request.
#           - Ein roter Lauf erscheint in Actions und kommt als Benachrichtigung bei allen an, die
#             Workflow-Fehler abonniert haben (GitHub -> Settings -> Notifications -> Actions).
#
# Zugang  : SUPABASE_ACCESS_TOKEN (Organisations-Secret), wie in datenbank-migration-preview.yml. Die
#           Umgebung "Preview" ist gewaehlt, damit der Lauf nicht auf die Freigabe der Umgebung
#           "Production" wartet; er schreibt nirgends.
# =============================================================================

name: Datenbank-Drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: datenbank-drift
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: hlcpxgnnyqmpqzpvgnxu

jobs:
  drift:
    name: Drift pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Zugangsdaten vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt (siehe Kopf von datenbank-drift.yml)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gleiche Version wie datenbank-migration-preview.yml: die Skripte lesen die JSON-Ausgabe der CLI.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Mit dem Projekt verbinden
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verlauf gegen Dateien pruefen
        id: verlauf
        continue-on-error: true
        shell: bash
        run: node scripts/pruefe-drift.mjs --linked 2>&1 | tee drift.txt; exit "${PIPESTATUS[0]}"

      - name: Strukturabgleich public und public_preview
        id: struktur
        continue-on-error: true
        shell: bash
        run: node scripts/preview-abgleich.mjs --linked --nur-bei-gleichem-stand 2>&1 | tee abgleich.txt; exit "${PIPESTATUS[0]}"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Datenbank-Drift (${SUPABASE_PROJECT_REF})"
            echo "- Verlauf gegen Dateien: ${{ steps.verlauf.outcome }}"
            echo "- Strukturabgleich: ${{ steps.struktur.outcome }}"
            echo '```'
            cat drift.txt abgleich.txt 2>/dev/null | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error haelt beide Schritte am Laufen; hier faellt der Lauf, wenn einer rot war.
      - name: Ergebnis
        if: steps.verlauf.outcome == 'failure' || steps.struktur.outcome == 'failure'
        run: |
          echo "::error::Drift gefunden, Details in den Schritten oben und in der Zusammenfassung."
          exit 1
