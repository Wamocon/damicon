# =============================================================================
# Caller Workflow - PR Pipeline (Auto-Fix + Checks)
# =============================================================================
# Source: Wamocon/github_workflow/examples/caller-pr-pipeline.yml
#
# Trigger : Automatically on every PR targeting main/master.
#           Also triggerable manually from the Actions tab.
#           This is the ONLY workflow that runs automatically.
#
# What it does:
#   1. Auto-Fix  - ESLint --fix + Prettier, commits fixes back to the PR branch.
#   2. PR Checks - TypeScript typecheck + ESLint lint.
#                  Blocks the PR merge if checks fail.
#
# SETUP - one thing to do:
#   Settings → Actions → General → Workflow permissions
#     Enable "Allow GitHub Actions to create and approve pull requests"
#     (required for the auto-fix commit-back to work)
# =============================================================================

name: PR Pipeline

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel redundant runs on the same PR when a new commit is pushed.
# Falls back to github.ref for manual (workflow_dispatch) runs.
concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --- Step 1: Auto-fix lint & format errors --------------------------------
  autofix:
    name: Auto-Fix
    uses: Wamocon/github_workflow/.github/workflows/pr-autofix.yml@main
    permissions:
      contents: write

  # --- Step 2: Validate code (typecheck + lint) -----------------------------
  validate:
    name: PR Checks
    needs: autofix
    uses: Wamocon/github_workflow/.github/workflows/pr-checks.yml@main

  # --- Step 3: Build und Datenbank ------------------------------------------
  # Typecheck und Lint fangen den Build nicht: Server-/Client-Grenzen, fehlende
  # Uebersetzungsschluessel und kaputte Migrationen fallen erst hier auf.
  # Die Fachregeln von Damicon liegen in der Datenbank - ohne diesen Lauf
  # waeren Sperrlogik und Rollenrechte in der CI ungeprueft.
  datenbank:
    name: Build und Integrationstests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase starten (Migrationen und Seed laufen mit)
        run: supabase start

      - name: Umgebung aus der laufenden Instanz schreiben
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SITE_NAME=Damicon"
          } >> .env.local

      - name: Demo-Zugänge anlegen
        run: npm run db:seed-auth

      - name: Integrationstests (RLS, Rollen, Sperrlogik, Kennzahlen)
        run: npm run db:test

      # pgvector laeuft nicht in PGlite, deshalb gegen die echte lokale Datenbank: Rollenisolation per RLS,
      # Hybridsuche, IDF, Filter ohne Trefferverlust und Schreibschutz der Wissensbasis.
      - name: Wissensbasis in Postgres (pgvector, Rollen, Suche, Schreibschutz)
        run: npm run test:wissen-db

      # Braucht kein laufendes Supabase: PGlite bringt Postgres als WASM mit
      # und wendet alle Migrationen selbst an. Deckt die Einladungen, den
      # Zukauf-Parser, den Ausweis-Scan und den KI-Assistenten ab - bis zu
      # diesem Lauf liefen drei dieser Dateien in keiner Pipeline mit.
      - name: Unit- und Datenbanktests (PGlite, ohne laufendes Supabase)
        run: npm test

      - name: Produktions-Build
        run: npm run build

      - name: Supabase stoppen
        if: always()
        run: supabase stop --no-backup
