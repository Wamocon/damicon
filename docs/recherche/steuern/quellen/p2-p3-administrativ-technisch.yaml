# Quellenregister P2-P3: Administrative Compliance-Maschinerie und technische Schnittstellen
#
# Rechercheeinheit: P2 Administrativ (wie man tatsaechlich compliant wird/bleibt),
# P3 Technisch (maschinelle Schnittstellen: ИС ЭСФ, СНТ, Virtueller Lager, ОФД, ЕСУТД, НКТ).
# Format gemaess quellenregister-schema.yaml (schema_version 1).
# Stand der Recherche: 2026-09-18.
#
# Hinweis zur Abrufbarkeit (siehe auch # Notizen am Dateiende): kgd.gov.kz, egov.kz und
# gov.kz sind teilweise klassische serverseitig gerenderte Seiten (Pfad-Typ /ru/content/...,
# dort lieferte WebFetch brauchbaren Fliesstext), teilweise JS-Single-Page-Apps (Pfad-Typ
# /ru/section/..., /ru/app/..., sowie generell egov.kz- und gov.kz-Artikelseiten), dort
# lieferte WebFetch nur das Navigations-/Seitengeruest ohne Fliesstext. Das ist pro Satz
# im Feld notiz vermerkt. Das websearch-Kontingent dieser (geteilten) Session wurde waehrend
# der Recherche erschoepft; einige Fakten stuetzen sich deshalb auf bereits eingeholte
# WebSearch-Synthesen statt auf zusaetzliche WebFetch-Direktpruefung - auch das ist je Satz
# vermerkt.

