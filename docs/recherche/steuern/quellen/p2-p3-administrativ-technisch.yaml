  abdeckung: >
    ENTSCHEIDENDE QUELLE ZUR SIGNATURFRAGE. Beschreibt das GOST-2015-Sitzungsmodell:
    ein Client signiert eine Anfrage zum Sitzungsaufbau, das System vergibt ein
    Sitzungs-Ticket (Standardgueltigkeit 30 Minuten, konfigurierbar 0-1440 Minuten).
    Woertlich (paraphrasiert): Nutzer muessen NCALayer zur Signatur von Dokumenten im
    GOST-2015-Format verwenden. In den Community-Kommentaren bestaetigt der
    Software-Hersteller auf Nutzerfrage zu Terminal-Servern ausdruecklich, dass der
    Dienst KEINE mehreren gleichzeitigen NCALayer-Sitzungen auf einem Terminalserver
    unterstuetzt ("aktuell eine Einschraenkung"), und verweist fuer Workarounds an den
    Support.
  beschaffung: "Frei zugaenglich."
  maschinell_abrufbar: true
  rag_eignung: hoch
  rag_hinweis: "Klarer technischer Praxisartikel inkl. Support-Dialog, sehr konkret und zitierfaehig."
  gueltig_ab: null
  gueltig_bis: null
  ist_ueberholt: false
  abgerufen_am: "2026-09-18"
  notiz: >
    ANTWORT AUF DIE SIGNATURFRAGE (siehe auch Zusammenfassung an den Auftraggeber):
    Der dokumentierte, von Software-Herstellern tatsaechlich genutzte Integrationsweg
    verlangt NCALayer - eine lokal installierte Hintergrundanwendung, die eine private
    Schluesseldatei besitzt und Signaturoperationen fuer die im selben Desktop laufende
    Software ausfuehrt. Das ist AUSDRUECKLICH NICHT fuer unbeaufsichtigten
    Mehrfachbetrieb auf einem Terminalserver ausgelegt (Hersteller-Zitat). Ergaenzend aus
    Suchindex-Snippets (nicht per WebFetch verifiziert): NCALayer wird laut
    pki.gov.kz/ncalayer/ heute als lokaler Hintergrunddienst ausgeliefert, nicht mehr als
    Java-Browser-Applet, und es existiert eine alternative Kryptobibliothek "KalkanCrypt"
    fuer Faelle, in denen NCALayer nicht nutzbar ist. Das aendert nichts an der
    Kernaussage: in JEDEM hier gefundenen Beleg bleibt eine lokal installierte
    Signaturkomponente auf einem vom Menschen bedienten Endpunkt noetig - keine reine
    Server-zu-Server-Signatur per hinterlegtem Schluessel ohne lokale Komponente. Der in
    kgd-api-esf-virtualsklad-anleitung erwaehnte "Signaturgenerator aus der
    Administratorkonsole" bleibt ein offener Gegenpunkt: er KOENNTE ein
    kommandozeilenfaehiges, servertaugliches Signaturwerkzeug sein - das wurde in dieser
    Recherche nicht abschliessend geklaert und erfordert direkte SDK-Inspektion oder
    Rueckfrage bei esfsd@kgd.minfin.gov.kz.

