# Notizen
#
# 1) WELCHE TECHNISCHEN ENDPUNKTE HABEN AUFGELOEST (waren erreichbar)?
#    - esf.gov.kz:8443/esf-web/app/pages/api -> ERREICHBAR (kein Verbindungsfehler trotz
#      Nicht-Standardport). Lieferte aber nur ein JS-SPA-Geruest ohne Methodentext.
#    - test3.esf.kgd.gov.kz:8443/esf-web/login -> ERREICHBAR, bestaetigt als aktive
#      Testumgebung (Versionskennung 4.0.0, Support-Kontakt esfsd@kgd.minfin.gov.kz).
#    - kgd.gov.kz/ru/content/... -> zuverlaessig mit Fliesstext erreichbar (klassisches
#      serverseitiges Rendering).
#    - kgd.gov.kz/ru/section/..., kgd.gov.kz/ru/app/..., egov.kz/cms/..., gov.kz/... ->
#      technisch erreichbar (HTTP 200), aber NUR Seitengeruest ohne Fliesstext (JS-Apps).
#    - cabinet.kgd.gov.kz/knp/main/ -> TLS-Zertifikatsfehler bei diesem Abruf.
#    - cabinet.salyk.kz UND salyk.kz -> LOESEN NICHT AUF (DNS NXDOMAIN). Die im
#      Rechercheauftrag genannte Domain existiert nicht (mehr). Tatsaechliche Adresse:
#      cabinet.kgd.gov.kz bzw. das ab 15.04.2026 erwaehnte knp.kgd.gov.kz (ISNA) - Letzteres
#      nicht direkt getestet, siehe knp-kgd-gov-kz-isna-neu.
#    Gesamtmuster: Kasachische Behoerdenportale sind ueberwiegend JS-Single-Page-Apps.
#    Fuer einen produktiven RAG-Ingest dieser Quellenklasse ist ein Headless-Browser
#    (z.B. Playwright) statt eines einfachen HTTP-Text-Extraktors noetig - das gilt fuer
#    praktisch alle kgd.gov.kz/esf.gov.kz/egov.kz/gov.kz-Seiten mit App-Charakter, nicht
#    nur fuer ИС ЭСФ. Reine Content-Artikelseiten (/ru/content/...) sind die Ausnahme und
#    funktionieren auch mit einfachem HTTP-Abruf.
#
# 2) DIE SIGNATURFRAGE - SERVERSEITIG ODER DESKTOP-APPLET?
#    Befund: ueberwiegend DESKTOP-APPLET (NCALayer) erforderlich, keine einfache
#    Server-zu-Server-Signatur. Belegkette: die KGD-eigene SDK-Anleitung
#    (kgd-api-esf-virtualsklad-anleitung) nennt einen "Signaturgenerator aus der
#    Administratorkonsole" als Schritt 2 - das klingt zunaechst nach einem
#    kommandozeilenfaehigen, potenziell servertauglichen Werkzeug. Die tatsaechliche
#    Praxis-Erfahrung von Software-Integratoren (pro1c-esf-ncalayer-signatur-pflicht)
#    zeigt jedoch: der produktiv genutzte Weg verlangt NCALayer, eine lokal installierte
#    Hintergrundanwendung mit privatem Schluessel, sitzungsbasiert (Ticket, 30 Min.
#    Standardgueltigkeit). Der Hersteller bestaetigt AUSDRUECKLICH, dass mehrere
#    gleichzeitige NCALayer-Sitzungen auf einem Terminalserver NICHT unterstuetzt werden -
#    also selbst ein zentralisierter "Signatur-Server" mit mehreren virtuellen
#    Desktop-Sitzungen stoesst laut Hersteller an eine dokumentierte Grenze. FAZIT: ein
#    vollautomatischer E-Rechnungs-Konnektor ohne jede lokale/interaktive Komponente ist
#    nach der vorliegenden Evidenz NICHT ohne Weiteres moeglich; realistisch ist bestenfalls
#    ein dedizierter (virtueller) Windows-Host pro Signatur-Akteur mit dauerhaft laufendem
#    NCALayer, was Automatisierung stark einschraenkt, aber nicht vollstaendig ausschliesst.
#    Der einzige offene Gegenpunkt (echte serverseitige Signatur ueber das
#    Konsolenwerkzeug im SDK) konnte in dieser Recherche NICHT abschliessend geklaert
#    werden - das SDK-Archiv selbst wurde nicht heruntergeladen/entpackt (siehe
#    kgd-esf-sdk-zip-2025). Empfehlung: vor einer Architekturentscheidung das SDK laden
#    und den "Signaturgenerator" konkret pruefen, oder direkt bei
#    esfsd@kgd.minfin.gov.kz nachfragen, ob ein reiner Server-Modus unterstuetzt wird.
#
# 3) API-DOKUMENTATION, DIE ANFRAGE/REGISTRIERUNG BRAUCHT:
