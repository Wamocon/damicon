  aktualisierung: jaehrlich
  abdeckung: >
    Ab 2026 gilt eine Umsatzschwelle von 10.000 MRP (43.250.000 KZT im Jahr 2026) fuer die
    Pflicht-USt-Registrierung im allgemeinen Steuerregime. Der Steuerantrag ist spaetestens
    5 Werktage nach Ueberschreiten der Schwelle zu stellen; bei einem einzelnen Geschaeft,
    das die Schwelle allein ueberschreitet, ist der Antrag VOR Ausfuehrung dieses Geschaefts
    zu stellen. Strafen: 50 MRP fuer verspaetete Registrierung, 15% des Umsatzes fuer
    Umsaetze ohne Registrierung trotz Schwellenueberschreitung. Von der Pflicht befreit:
    staatliche Einrichtungen, Personen in freien Berufen, Steuerpflichtige in
    Sonderregimen, Privatpersonen ohne ИП-Status.
  beschaffung: "Frei zugaenglich."
  maschinell_abrufbar: true
  rag_eignung: hoch
  rag_hinweis: "Klar strukturierter Praxisartikel mit Zahlenwerten, gut zitierbar."
  gueltig_ab: "2026-01-01"
  gueltig_bis: null
  ist_ueberholt: false
  abgerufen_am: "2026-09-18"
  notiz: >
    Kernzahlen (10.000 MRP / 43,25 Mio KZT / 5 Werktage / 50 MRP / 15%) stammen aus einer
    WebSearch-Synthese ueber mehrere unabhaengige Praktikerquellen (u.a. actgr.kz,
