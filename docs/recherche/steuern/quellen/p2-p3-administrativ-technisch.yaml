    erschoepft - eine Nachpruefung wird empfohlen, bevor diese Aussage als final gilt.
    Indizieller Gegenbeleg fuer Kontinuitaet: das SDK-Archiv heisst weiterhin
    "esf-sdk-2025.zip" (siehe kgd-esf-sdk-zip-2025), also vermutlich ohne grundlegenden
    Authentifizierungsbruch aktualisiert.

