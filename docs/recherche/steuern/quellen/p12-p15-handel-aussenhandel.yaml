  abdeckung: >
    ZWEITER, von der Zollstundung (siehe tkeaes-ru-zollwert-berechnung-stundung-rus)
    UNABHAENGIGER Erleichterungsmechanismus, diesmal fuer die EINFUHR-USt: Fuer eine
    per Regierungs-/Ministerialliste festgelegte Warengruppe wird die USt nicht bar
    gezahlt, sondern per "методом зачета" (Verrechnungsmethode: gleichzeitige
    Belastung und Gutschrift, netto keine Zahlung) verbucht - bedingt durch
    Verbleib/Nutzung im Land. Warenliste laut Sekundaerquellen (bcc.kz, 1cbit.kz,
    actgr.kz, uebereinstimmend): Ausruestung, **сельскохозяйственная техника**
