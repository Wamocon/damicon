    Eisenbahnlokomotiven/-waggons, Ersatzteile dafuer, **Zuchttiere und
    Besamungsausruestung**, lebendes Rindvieh - importiert unter dem Zollverfahren
    "Ueberfuehrung in den freien Verkehr". Bedingungen (Sekundaerquellen mit
    Abweichungen, nicht primaerquellen-verifiziert): Verbleib in Kasachstan,
    Weiterverkaufsverbot, Mindestnutzungsdauer ca. 5 Jahre (18 Monate bei
    Gefluegelzucht-Ausruestung), Leasing-Ausnahme bei Laufzeit &gt;3 Jahre und ≥90%
