    Seitengeruest ohne Artikeltext - fuer den produktiven Ingest wird ein echter
    Renderer/Headless-Browser oder eine andere Abrufroute (z.B. offizielle API, falls
    vorhanden) benoetigt. Mit einfachem HTTP-Text-Extraktor nicht nutzbar.
  gueltig_ab: "2026-01-01"
