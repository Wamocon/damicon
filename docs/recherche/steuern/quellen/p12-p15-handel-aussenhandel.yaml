- id: eaeunion-tk-eaes-dogovor-2017-rus
  name: "Zollkodex der EAWU (ТК ЕАЭС), Vertragstext"
  name_original: "Договор о Таможенном кодексе Евразийского экономического союза от 11.04.2017"
  herausgeber: "Eurasische Wirtschaftskommission (ЕЭК) / Vertragsrechtliche Datenbank der EAWU"
  url: "https://docs.eaeunion.org/docs/ru-ru/01413569/itia_12042017"
  perspektiven: [P15, P14, P13]
  autoritaetsstufe: 1
  sprachen: [ru]
  zugang: frei
  kosten:
    betrag: null
    waehrung: null
    periode: null
    verifiziert: false
    beleg_url: null
  aktualisierung: unbekannt
  abdeckung: >
    Vollstaendiger Zollkodex der EAWU (Anlage 1 zum Vertrag), in Kraft seit 2018-01-01.
    Fuer die Agrar-/Handelsperspektive zentral: Kapitel 29 (Art. 219-226), Zollverfahren
    "voruebergehende Einfuhr (Zulassung)". Art. 219: Definition (teilweise Befreiung von
    Einfuhrzoll/-steuern als Regelfall, volle Befreiung nur fuer durch die Kommission
    gelistete Warenkategorien); Art. 221: Hoechstdauer grundsaetzlich 2 Jahre,
    verlaengerbar; Art. 223: bei Teilzahlung 3% des vollen Einfuhrabgabenbetrags pro
    Kalendermonat; Art. 224-226: Beendigung/Ueberfuehrung in freien Verkehr. Direkt
    anwendbares Unionsrecht, geht nationalem kasachischem Recht vor.
  beschaffung: "Frei zugaenglich."
  maschinell_abrufbar: false
  rag_eignung: gering
  rag_hinweis: >
    Primaerquelle, aber als PDF mit teils bildbasiertem/kodiertem Inhalt verteilt, nicht
    sauber per Texauszug abrufbar. Fuer Zitate wurden Artikel-Spiegel bei consultant.ru
    (z.B. .../ee29a14c7168530334042ad8a97ed5e6a3b3fcd1/ fuer Art. 219) und alta.ru
    (Muster .../codex-2018/R{Abschnitt}/GL{Kapitel}/ST{Artikel}/) verwendet.
  gueltig_ab: "2018-01-01"
  gueltig_bis: null
  ist_ueberholt: false
  abgerufen_am: "2026-09-18"
  notiz: >
    Verbatim-Zitat Art. 219: "Таможенная процедура временного ввоза (допуска) - это
    таможенная процедура, применяемая в отношении иностранных товаров, в соответствии с
    которой такие товары временно находятся и используются на таможенной территории
    Союза при соблюдении условий помещения товаров под эту таможенную процедуру и их
    использования, с частичной уплатой ввозных таможенных пошлин, налогов и без уплаты
    специальных, антидемпинговых, компенсационных пошлин либо без уплаты ввозных
    таможенных пошлин и налогов." Art. 223: "За каждый календарный месяц... подлежат
    уплате 3 процента исчисленной на день регистрации таможенной декларации... суммы
    ввозных таможенных пошлин, налогов, которая подлежала бы уплате, если бы товары...
    помещались под таможенную процедуру выпуска для внутреннего потребления." OFFEN: ob
    und wo Kasachstan diesen Vertrag ergaenzend per Ratifizierungsgesetz auf
    adilet.zan.kz veroeffentlicht, sowie Titel/Fundstelle des nationalen
    Ausfuehrungsgesetzes zum Zollkodex, wurden nicht verifiziert.

