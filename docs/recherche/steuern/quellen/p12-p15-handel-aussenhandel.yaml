- id: kgd-esf-regeln-2015-kategorie-rus
  name: "KGD: ESF-Dokumentenumlaufregeln (Fassung 2015) - Feld 'Kategorie des Lieferanten'"
  name_original: "Правила документооборота счетов-фактур, выписываемых в электронном виде (утв. 10.11.2015)"
  herausgeber: "Komitee fuer Staatseinnahmen, Finanzministerium der Republik Kasachstan"
  url: "https://kgd.gov.kz/ru/content/pravila-dokumentooborota-schetov-faktur-vypisyvaemyh-v-elektronnom-vide-1"
  perspektiven: [P12]
  autoritaetsstufe: 2
  sprachen: [ru, kk]
  zugang: frei
  kosten:
    betrag: null
    waehrung: null
    periode: null
    verifiziert: false
    beleg_url: null
  aktualisierung: unbekannt
  abdeckung: >
    Historische (2015er) Fassung der ESF-Dokumentenumlaufregeln, die das Feld "категория
    поставщика" (Zeile 10) erstmals detailliert erlaeutert: auszufuellen, wenn der
    Lieferant Komitent, Kommissionaer, Spediteur, Leasinggeber u.a. ist; sonst
    leerzulassen ("Ст.31: в строке 10 «Категория поставщика» указывается категория
    поставщика ... если поставщик ... является комитентом, комиссионером, экспедитором,
    лизингодателем ... В случае если поставщик не относится ни к одной из перечисленных
    категорий, строка не заполняется."). Dieses Feld-Konzept setzt sich strukturell in
    den 2026er-Regeln (Anordnung Nr. 629) fort.
  beschaffung: "Frei zugaenglich."
  maschinell_abrufbar: true
  rag_eignung: gering
  rag_hinweis: >
    Nur als historischer/struktureller Hintergrund zum Verstaendnis des Feldes
    "категория поставщика" brauchbar, nicht als aktuelle Rechtsgrundlage - durch
    Anordnung Nr. 629 (2026) abgeloest.
  gueltig_ab: "2015-11-10"
  gueltig_bis: "2025-12-31"
  ist_ueberholt: true
  abgerufen_am: "2026-09-18"
  notiz: "Explizit als Vorgaengerregelung gefuehrt; bestaetigt aber die langjaehrige Kontinuitaet des komissionsspezifischen ESF-Feldes, das Abschnitt 1.5 des Rohbefunds fuer 2026 beschreibt."

