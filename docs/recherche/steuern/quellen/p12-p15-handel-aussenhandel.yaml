- id: adilet-nk-214-viii-export-kapitel-47-52-rus
  name: "NK RK, Exportkapitel: Art. 467, 503, 506, 520, 521, 531, 532 (Nullsatz und заявление-о-ввозе-Frist)"
  name_original: "Налоговый кодекс РК, Глава 47 (ст. 467, 503), Глава 52 (ст. 506, 520, 521, 531, 532)"
  herausgeber: "Republik Kasachstan / NZPI Adilet"
  url: "https://adilet.zan.kz/rus/docs/K2500000214"
  perspektiven: [P13]
  autoritaetsstufe: 1
  sprachen: [ru, kk]
  zugang: frei
  kosten:
    betrag: null
    waehrung: null
    periode: null
    verifiziert: false
    beleg_url: null
  aktualisierung: unbekannt
  abdeckung: >
    GEKLAERT (Widerspruch aus fruehrer Fassung dieses Registereintrags aufgeloest, siehe
    notiz): Kapitel 47 legt mit **Art. 467** ("Оборот по реализации товаров на
    экспорт") die Nullsatzbesteuerung des Warenexports allgemein fest, rueckverwiesen
    durch **Art. 503 п.1** ("Обороты по реализации товаров, работ, услуг, указанные в
    главе 47 настоящего Кодекса, облагаются налогом на добавленную стоимость по
    нулевой ставке" - und an gleicher Stelle der Regelsatz: "ставка налога на
    добавленную стоимость составляет 16 процентов"). Kapitel 52 regelt den
    EAWU-spezifischen Export: **Art. 520** ("Экспорт товаров в ЕАЭС") ordnet den
    Nullsatz fuer Ausfuhren in EAWU-Mitgliedstaaten an; **Art. 521**
    ("Подтверждение экспорта товаров") listet die Nachweisdokumente (Vertrag,
    заявление о ввозе mit Steuerbehoerden-Vermerk, Transportdokumente). **Art. 531**
    ("Порядок исчисления и уплаты налога при экспорте товаров") ist DIE entscheidende
    Norm: Bleibt das заявление о ввозе binnen 180 Kalendertagen ab Umsatztag aus, wird
    der Regelsatz (16 %, Art. 503 п.1) faellig, zahlbar nach Art. 506 (25. Tag des
    zweiten Folgemonats), mit spaeterer Anrechnungs-/Erstattungsmoeglichkeit bei
    Nachreichen (Art. 531 п.4), aber ohne Ruckerstattung bereits gezahlter Saeumnis-
    zuschlaege. **Art. 532** ("Отзыв заявления о ввозе товаров и уплате косвенных
    налогов") regelt Ruecknahme/Korrektur der Erklaerung.
  beschaffung: "Frei zugaenglich."
  maschinell_abrufbar: false
  rag_eignung: hoch
  rag_hinweis: >
    Zentralster Einzelfund der gesamten P13-Recherche - die Artikelkette 467/503/506/
    520/521/531/532 beantwortet die Kernfrage vollstaendig mit Artikelnummern und
    Wortlaut. Adilet selbst beim automatisierten Abruf nicht maschinenlesbar (wie
    durchgaengig in dieser Recherche), Wortlaut ueber Spiegel (kodeksy-kz.com,
    pavlodar.com) verifiziert.
  gueltig_ab: "2026-01-01"
  gueltig_bis: null
  ist_ueberholt: false
  abgerufen_am: "2026-09-18"
  notiz: >
    KORREKTUR einer fruehreren Fassung dieses Eintrags: Dort wurde ein Widerspruch
    dokumentiert, ob "Отзыв заявления о ввозе" bei Art. 458 steht (eine
    Navigationsleisten-Auswertung hatte das behauptet, ein Volltextabruf von Art. 458
    zeigte aber einen voellig anderen Inhalt/Treuhandverwaltung). Die Parallelrecherche
    P13 hat die korrekte Fundstelle unabhaengig ermittelt: **Art. 532**, nicht 458. Der
    Fehler lag also in der fruehreren Navigationsleisten-Lesung. Verbatim-Zitate:
    Art. 531 (sinngemaess): "При непоступлении в электронной форме в налоговый орган
    Республики Казахстан заявления о ввозе товаров и уплате косвенных налогов в
    течение ста восьмидесяти календарных дней с даты совершения оборота по реализации
