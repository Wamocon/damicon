  abgerufen_am: "2026-09-18"
  notiz: >
    Artikelnummern 455, 456, 480, 481, 484, 495, 503, 506, 508, 509, 517, 518, 520,
    521, 525, 526, 530, 531, 532 in dieser Recherche ueber Spiegelportale (v.a.
    kodeksy-kz.com, siehe kodeksy-kz-nk-mirror-rus) wortlautgenau bzw. inhaltlich
    verifiziert, nicht direkt bei adilet gelesen. Empfehlung: vor produktivem Ingest
    stichprobenartig gegen adilet direkt gegenpruefen.

    WICHTIGER METHODISCHER FUND (aus der P14-Parallelrecherche, durch Auswertung des
    adilet-Seitenquelltexts direkt bestaetigt): Die Nichtabrufbarkeit von adilet.zan.kz
    fuer einfache HTTP-Clients ist **kein technischer Zufall, sondern erklaerte
    Absicht** des Betreibers. Ein Entwicklerkommentar im Seitenquelltext lautet
    sinngemaess: "Полного текста здесь нет намеренно: цель - чтобы нас цитировали, а
    не выкачивали корпус одной командой" (Der Volltext fehlt hier absichtlich: das
    Ziel ist, zitiert zu werden, nicht dass der Korpus mit einem einzigen Befehl
    abgesaugt wird). Fuer die RAG-Ingestion (rag-ingest-spezifikation.md) bedeutet
    das: ein Headless-Browser-Ansatz ist nicht nur technisch noetig, sondern läuft
    einer ausdruecklichen Anti-Bulk-Scraping-Politik des Betreibers zuwider - vor
    einem automatisierten Volltext-Ingest sollte rechtlich/ethisch geprueft werden,
    ob eine andere Bezugsquelle (z.B. eine offizielle API, falls vorhanden, oder eine
    kostenpflichtige Datenbank wie ISS Paragraf/zakon.kz) der beabsichtigten Nutzung
    des Betreibers eher entspricht als Massenabruf gegen die erklaerte Absicht.

