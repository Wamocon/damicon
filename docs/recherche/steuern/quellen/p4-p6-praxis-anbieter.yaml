# Quellenregister P4/P6: Praktiker-Wissensquellen, Anbieter-Teardown, verifizierte Preise
#
# Rechercheeinheit: P4 Praktiker, P6 Anbieter-Teardown, plus uebergreifender Auftrag
# "verifizierte Preise" (Abschnitt A). Format gemaess quellenregister-schema.yaml
# (schema_version 1). Stand der Recherche: 2026-09-18.
#
# Methodik-Hinweis: Preise wurden, wo moeglich, per WebFetch direkt von der
# Anbieter-Preisseite gelesen (nicht aus Suchergebnis-Schnipseln uebernommen).
# WebSearch stand nur fuer einen Teil der Recherche zur Verfuegung (Budget wird von
# allen parallelen Rechercheeinheiten gemeinsam verbraucht und war ab ca. der Haelfte
# dieser Sitzung erschoepft); der Rest der Recherche laeuft ueber WebFetch auf konkret
# geratene/gefundene URLs. Wo das zu Luecken fuehrte, ist das im jeweiligen notiz-Feld
# offen vermerkt statt stillschweigend uebersprungen.
#
# Schema-Beobachtung fuer die Schema-Pflege: kosten.periode kennt nur jahr, einmalig,
# pro_dokument, null. Mehrere Anbieter (asistent.kz, itsheff.kz, iDocs) fakturieren
# jedoch monatlich. Diese Faelle sind unten mit periode: null und der echten Kadenz im
# notiz-Feld gefuehrt, um keine falschen Jahreswerte zu erfinden.

# ============================================================
# ABSCHNITT A: VERIFIZIERTE PREISE (Kernauftrag)
# ============================================================

