# Quellenregister - P8 (Wissenschaft) und P9 (Buecher)
#
# Rechercheeinheit: P9 Buecher + P8 Akademische Quellen.
# Auftrag: kaufbereite Bibliographie fuer Vektordatenbank-Ingest plus wissenschaftliche
# Sekundaerliteratur zur kasachischen Steuerreform 2025/2026.
#
# Kernbefund vorab: Kasachstan hat seinen Steuerkodex zum 01.01.2026 komplett ersetzt
# (Gesetz Nr. 214-VIII vom 18.07.2025). Fast der gesamte hier gefundene Buchmarkt
# stammt aus der Zeit VOR diesem Stichtag. Wo ist_ueberholt=true gesetzt ist, gilt das
# nach der harten Regel des Schemas (alles vor Kodex 214-VIII), auch wenn der Inhalt
# (z.B. MSFO-Theorie, Landrecht, empirische Strukturanalyse) fachlich weiterhin trägt.
# Die jeweilige Notiz erklaert den Unterschied zwischen "Regel veraltet" und
# "Methode/Struktur weiter brauchbar".
#
# Recherchestand: WebSearch-Kontingent der Session wurde waehrend der Recherche
# erschoepft (gemeinsames Kontingent mehrerer paralleler Rechercheagenten). Ab diesem
# Punkt wurde ausschliesslich per WebFetch auf bereits bekannte oder konstruierte URLs
# zugegriffen. Direktzugriff auf die Repositorien von KAZGUU (repository.kazguu.kz,
# Verbindung verweigert) und Narxoz war in dieser Sitzung nicht moeglich. Fuer eine
# vertiefte Suche nach KIMEP-/Narxoz-/KAZGUU-Dissertationen speziell zur Steuerreform
# 2025/2026 wird eine Folge-Recherche mit frischem Suchkontingent und/oder direktem
# Bibliothekszugang empfohlen.
#
# abgerufen_am fuer alle Saetze: 2026-09-18

