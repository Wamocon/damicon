  - id: koap-rk-art-280-1-esf-verstoesse
    name: "KoAO RK Art. 280-1: Verstoss gegen ESF-Ausstellungsfristen"
    name_original: "Narushenie srokov vypiski i nevypiska schyeta-faktury v elektronnoy forme"
    herausgeber: "Republik Kasachstan (Kodex ueber Ordnungswidrigkeiten Nr. 235-V vom 05.07.2014)"
    url: "https://adilet.zan.kz/rus/docs/K1400000235"
    perspektiven: [P10]
    autoritaetsstufe: 1
    sprachen: [ru, kk]
    zugang: frei
    kosten:
      betrag: null
      waehrung: null
      periode: null
      verifiziert: false
      beleg_url: null
    aktualisierung: unbekannt
    abdeckung: >-
      Art. 280-1: Nichtausstellung einer elektronischen Rechnung (ESF) - beim ersten Verstoss
      innerhalb eines Jahres nur Verwarnung, bei Wiederholung 40/100/150 MRP (klein/mittel/gross).
      Verspaetete Ausstellung (Fristverstoss) - Verwarnung, bei Wiederholung 20/50/100 MRP.
      Jede verspaetete/fehlende ESF gilt als eigener Verstoss (keine Sammelstrafe pro Zeitraum).
    beschaffung: "Primaertext frei auf adilet.zan.kz."
    maschinell_abrufbar: false
    rag_eignung: mittel
    rag_hinweis: >-
      adilet.zan.kz liefert bei einfachem HTTP-Abruf nur ein leeres JS-Geruest, kein Fliesstext -
      Ingest braucht gerenderten Abruf (Headless-Browser) oder eine der amtlichen PDF-Exportvarianten
      (z.B. .../file_235.htm, beim Test ebenfalls ohne auswertbaren Inhalt). Inhalte dieses
      Eintrags wurden ueber die Rechtsdatenbank kodeksy-kz.com gegengeprueft (Sekundaerspiegel,
      Wortlaut mit Stand 2026 laut Seitentitel).
    gueltig_ab: "2026-01-01"
    gueltig_bis: null
    ist_ueberholt: false
    abgerufen_am: "2026-09-18"
    notiz: >-
      Fuer das ERP-Projekt zentral: jede verspaetete ESF ist ein Einzelverstoss, nicht pro
      Abrechnungszeitraum gebuendelt - bei hoher Belegzahl kann sich die Strafsumme schnell
      addieren. Betragsangaben stammen aus Sekundaerspiegel, nicht direkt von adilet verifiziert -
      vor Produktivsetzung gegen amtliche Veroeffentlichung (z.B. Zakon.kz PDF-Abo) pruefen.

