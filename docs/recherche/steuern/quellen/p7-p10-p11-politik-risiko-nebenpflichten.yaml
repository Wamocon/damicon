# Quellenregister - P7 Politik/Strategie, P10 Risiko/Durchsetzung, P11 Nebenpflichten
#
# Rechercheeinheit: P7 (Policy/strategisch, investorenfacing), P10 (Risiko/Durchsetzung),
# P11 (Nebenpflichten: Arbeitsrecht, Sozialversicherung, Statistik).
# Format gemaess quellenregister-schema.yaml, schema_version 1.
#
# Zentrale Pruefergebnisse dieser Einheit (siehe auch kernwissen/sanktionen-rohbefund.md):
# 1. Die "2.000 MRP"-Angabe fuer ESUTD-Vertragsregistrierung aus Marketingtexten ist FALSCH.
#    Der tatsaechliche Hoechstsatz betraegt 200 MRP (KoAP RK Art. 98 Abs. 1-1/1-2, in Kraft
#    seit 12.03.2026). Mehrfach unabhaengig bestaetigt, siehe koap-rk-art-98-esutd-verstoesse.
# 2. taxratesbycountry.com listet fuer 2026 weiterhin MwSt 12% und wirbt mit "verified June 2026" -
#    klarer Beleg fuer veraltete englischsprachige Aggregatoren. Siehe taxratesbycountry-kasachstan-veraltet.
# 3. adilet.zan.kz ist per einfachem HTTP-Abruf NICHT maschinell auswertbar (liefert nur ein
#    JS-Geruest ohne Inhalt). Das betrifft ALLE Primaerrechtsquellen dieser Liste mit
#    maschinell_abrufbar: false und ist ein Befund fuer die RAG-Ingest-Pipeline, nicht nur
#    fuer diese Recherche: ein Standard-HTTP-Fetch reicht nicht, es braucht Rendering.
#
# Stand: 2026-09-18
# Abgerufen von: Rechercheeinheit P7/P10/P11

schema_version: 1

