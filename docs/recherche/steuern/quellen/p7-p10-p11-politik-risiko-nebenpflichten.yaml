      Arbeitsunfall-Meldung oder Gefaehrdungsbeurteilung in der Landwirtschaft gefunden -
      lediglich die allgemeine Rechtsgrundlage (Abschnitt 5) und das Gleichstellungsprinzip fuer
      Saisonarbeiter. Empfehlung fuer Folgerecherche: gezielt nach "rassledovanie neschastnykh
      sluchaev na proizvodstve" (Untersuchung von Arbeitsunfaellen) und der zustaendigen
      Meldeverordnung des Ministeriums fuer Arbeit und Sozialschutz suchen, sowie nach einer
      branchenspezifischen Regel fuer Landwirtschaft/Landtechnik (erhoehtes Unfallrisiko bei
      Erntetechnik).
