      ist_ueberholt=true bezieht sich auf die beschriebenen Steuersaetze, nicht auf die
      Reformempfehlungen, die als Erklaerung fuer die Reformrichtung weiter relevant sind. Sollte
      im RAG-Index klar von aktuellem Recht getrennt, aber nicht geloescht werden.

