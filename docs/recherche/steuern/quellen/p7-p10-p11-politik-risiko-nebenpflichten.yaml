      Verbreiterung KPN-Basis, Vereinfachung SNR) folgen sichtbar der OECD-Linie von 2020. Fuer
      Investorengespraeche als "seit sechs Jahren angekuendigt, jetzt umgesetzt"-Beleg geeignet.
