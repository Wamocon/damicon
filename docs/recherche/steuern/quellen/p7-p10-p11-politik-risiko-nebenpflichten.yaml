      Definiert "grossen Umfang" (krupnyy razmer) nach Art. 3 Abs. 38 StGB als nicht gezahlte
      Pflichtabgaben ueber 50.000 MRP im Pruefzeitraum, sofern die im Rahmen einer Steuerpruefung
      fuer ein Kalenderjahr festgestellte Steuerschuld 10% der vom Steuerpflichtigen fuer dieses
      Jahr insgesamt berechneten Abgaben uebersteigt. Rechtsfolge bei "grossem Umfang": Geldstrafe
      vom Zwei- bis Dreifachen der nicht gezahlten Summe, oder gemeinnuetzige Arbeit bis 800
      Stunden, oder Freiheitsbeschraenkung/-entzug bis drei Jahre, jeweils mit moeglichem
