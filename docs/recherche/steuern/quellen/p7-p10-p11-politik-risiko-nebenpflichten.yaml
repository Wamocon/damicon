      Umfassende OECD-Analyse des kasachischen Steuersystems vor der Reform: Empfehlungen fuer
      ein breiteres, progressiveres ESt-System, hoehere Sozialversicherungsbeitraege, eine
      verbesserte MwSt-Struktur und die Vereinfachung der Sonderregime fuer KMU. Kapitelstruktur
