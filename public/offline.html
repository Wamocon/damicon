<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damicon - Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #1c1c1a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #171715; color: #f0f0ee; }
        .karte { background: #201f1c !important; border-color: #34332e !important; }
        button { background: #f0f0ee !important; color: #171715 !important; }
      }
      .karte {
        max-width: 360px;
        text-align: center;
        border: 1px solid #e3e2dd;
        border-radius: 16px;
        background: #ffffff;
        padding: 32px 28px;
      }
      h1 { font-size: 1rem; font-weight: 800; margin: 0 0 8px; }
      p { font-size: 0.8125rem; line-height: 1.4; color: inherit; opacity: 0.75; margin: 0 0 20px; }
      button {
        border: none;
        border-radius: 10px;
        background: #1c1c1a;
        color: #fff;
        font-weight: 700;
        font-size: 0.8125rem;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="karte">
      <h1>Keine Verbindung</h1>
      <p>
        Diese Seite wurde noch nicht geladen und ist deshalb ohne Netz nicht
        verfügbar. Bereits besuchte Seiten und offen erfasste Formulardaten
        bleiben erhalten und werden automatisch gesendet, sobald wieder Netz
        da ist.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
